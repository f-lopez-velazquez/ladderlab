name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --audit=false
      - name: Audit dependencies
        shell: bash
        run: |
          set +e
          timeout 90s npm run audit
          audit_status=$?
          set -e
          if [ "$audit_status" -eq 124 ]; then
            echo "::warning::npm audit timed out; Dependabot remains enabled for advisory monitoring."
          elif [ "$audit_status" -ne 0 ]; then
            exit "$audit_status"
          fi
      - run: npm run build
